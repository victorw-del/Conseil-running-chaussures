<!DOCTYPE html>
<!-- Cette ligne dit au navigateur : « ce fichier est une page web moderne (HTML5) ». -->
<html lang="fr">
<!-- <html> englobe toute la page. lang="fr" indique que le texte est en français. -->

  <head>
    <!-- <head> contient les infos SUR la page, invisibles dans la page elle-même. -->
    <meta charset="UTF-8">
    <!-- UTF-8 permet d'afficher correctement les accents (é, è, à...). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Cette ligne rend la page lisible sur téléphone (sans zoom arrière). -->
    <title>Conseil chaussures running</title>
    <!-- Le texte affiché dans l'onglet du navigateur. -->
  </head>

  <body>
    <!-- <body> contient tout ce qui est VISIBLE dans la page. -->
    <h1>Bonjour !</h1>
    <!-- <h1> est le titre principal de la page. -->
    <p>Bientôt ici : un conseiller pour choisir tes chaussures de running.</p>
    <!-- <p> est un paragraphe de texte. -->
  </body>

</html>
