<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" role="img" aria-labelledby="titre">
  <title id="titre">Les trois types de foulée : neutre, pronateur et supinateur, vus de dos et par l'usure de la semelle</title>
  <!-- Schéma dessiné pour le site. En haut : les deux pieds vus de dos.
       En bas : les deux semelles vues de dessus, la zone dorée montre où elles s'usent. -->
  <style>
    .trait { stroke: #1a1814; stroke-width: 2; fill: none; stroke-linecap: round; }
    .semelle { stroke-width: 1.5; }
    .talon { fill: #fffdf8; stroke: #1a1814; stroke-width: 2; }
    .axe { stroke: #a8823f; stroke-width: 2; stroke-dasharray: 3 3; }
    .sol { stroke: #756e60; stroke-width: 1; }
    .zone { fill: #a8823f; opacity: 0.85; }
    .texte { font-family: Georgia, serif; font-size: 15px; font-weight: 700; fill: #1a1814; }
    @media (prefers-color-scheme: dark) {
      .trait, .talon { stroke: #f3efe6; }
      .talon { fill: #16161a; }
      .axe { stroke: #c9a35b; }
      .sol { stroke: #a39e93; }
      .zone { fill: #c9a35b; }
      .texte { fill: #f3efe6; }
    }
  </style>
  <g>
    <line class="trait" x1="38" y1="6" x2="38" y2="48"/>
